name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/wizard-deck-generator-0oexsn
  workflow_dispatch:

# Rechte, die der Workflow braucht, um Pages zu aktivieren und zu deployen.
permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur ein Deploy gleichzeitig.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true aktiviert GitHub Pages automatisch, falls noch nicht aktiv.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Gesamtes Repo-Root; index.html liegt hier -> Seite direkt erreichbar.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
